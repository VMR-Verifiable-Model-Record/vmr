# Law 1 made structural for the CLI too (docs/dev/phase5.md C2): no clock,
# no environment read and no unordered collection anywhere in this crate,
# except the ONE clock read at the application boundary - src/clock.rs,
# allowed there by name with its reason. Tests that genuinely read the
# environment (a child process needs its SystemRoot on Windows) say why
# with #[allow(clippy::disallowed_methods)].
#
# Per crate, like vmr-record, vmr-provenance and vmr-verify: a
# workspace-wide file would also bind vmr-ffi, whose build script reads its
# configuration from the environment.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "Law 1: time is an input; the CLI reads the clock only in src/clock.rs" },
    { path = "std::time::Instant::now", reason = "Law 1: no clock reads" },
    { path = "std::env::var", reason = "Law 1: a result depends on its inputs, never on the environment" },
    { path = "std::env::var_os", reason = "Law 1: a result depends on its inputs, never on the environment" },
    { path = "std::env::vars", reason = "Law 1: a result depends on its inputs, never on the environment" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "Law 1: no unordered iteration; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "Law 1: no unordered iteration; use BTreeSet" },
]
